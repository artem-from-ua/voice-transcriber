[project]
name = "voice"
version = "0.36.0"
description = "End-to-end local pipeline: audio → diarized transcript + TLDR (Whisper + pyannote + in-process MLX LLM)"
readme = "README.md"
authors = [
    { name = "Artem Naluzhnyy", email = "Artem.Naluzhnyy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.14.0",
    "lm-format-enforcer>=0.10",
    "mlx-lm>=0.21",
    "mlx-whisper>=0.4.3",
    "psutil>=7.2.2",
    "pyannote-audio>=3.1",
    "python-levenshtein>=0.27.3",
    "rich>=13",
    "scipy>=1.14",
    "soundfile>=0.12",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
voice = "voice.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
