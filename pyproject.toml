[project]
name = "voice"
version = "0.2.0"
description = "End-to-end local pipeline: audio → diarized transcript + TLDR (VibeVoice-ASR + pyannote + local LLM via LM Studio)"
readme = "README.md"
authors = [
    { name = "Artem Naluzhnyy", email = "Artem.Naluzhnyy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mlx-audio>=0.4.3",
    "pyannote-audio>=3.1",
    "python-levenshtein>=0.27.3",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
voice = "voice.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
